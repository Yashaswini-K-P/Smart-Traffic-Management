
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: trafficiq-backend
    ports:
      - "8000:8000"
    volumes:
      - traffic_model:/app/backend/models
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trafficiq-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  traffic_model:
